# Chat model for retrieval-agent / k8s-agent. Applied directly with kubectl,
# not through releases/ + Flux -- see docs/adr/0003-chat-model-for-kagent-agents.md
# for why (GitOps loop here reconciles from upstream's OCI artifact, not this
# fork; out of scope for a course lab to wire up properly).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-chat
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp-chat
    spec:
      containers:
        - name: llama-server
          image: velesha-chat-sidecar:qwen2.5-3b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-chat
  namespace: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: llama-cpp-chat
  ports:
    - port: 8082
      targetPort: 8082
